version: 2
updates:
  - package-ecosystem: npm
    target-branch: develop
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Colombo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    target-branch: develop
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
