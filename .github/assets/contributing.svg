<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200" viewBox="0 0 1280 200" role="img" aria-label="Team Sudda: Contributing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05112e"/>
      <stop offset="1" stop-color="#0a1d43"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffd000" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffd000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="200" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="200" fill="url(#bg)"/>
    <rect width="1280" height="200" fill="url(#dots)"/>
    <rect width="1280" height="200" fill="url(#glow)"/>
    <g fill="none" stroke="#ffd000">
      <circle cx="1110" cy="100" r="50" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="1110" cy="100" r="95" stroke-opacity="0.28" stroke-width="2"/>
      <circle cx="1110" cy="100" r="145" stroke-opacity="0.13" stroke-width="2"/>
    </g>
    <rect x="64" y="52" width="32" height="4" rx="2" fill="#ffd000"/>
    <text x="106" y="58.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#ffd000">TEAM SUDDA</text>
    <text x="62" y="118" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-1" fill="#ffffff">Contributing</text>
    <text x="64" y="156" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#d1d5db">How a change moves from idea to production</text>
  </g>
</svg>
